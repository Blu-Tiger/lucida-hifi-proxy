name: Build and publish image

# Publishes ghcr.io/blu-tiger/lucida-hifi-proxy, which is the image
# docker-compose.yml runs.
#
# FIRST RELEASE ONLY: a GHCR package created by this workflow is PRIVATE even
# when the repository is public, so pick "Change visibility" -> Public once in the
# package settings (github.com/users/<owner>/packages/container/<name>/settings).
# Until then, `docker compose up -d` fails to pull for anyone but you.
#
# Note this workflow lowercases the owner because GHCR rejects uppercase image
# names, and github.repository preserves the owner's casing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Catches a syntax error before a 5-minute image build does.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile lucida_hifi_proxy.py lucidadl/api.py

      - uses: docker/setup-buildx-action@v3

      # GHCR rejects uppercase image names, and github.repository keeps the
      # owner's casing, so lowercase it explicitly.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
